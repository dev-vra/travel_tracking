# Infraestrutura local do GeoMatrícula.
# PostgreSQL + PostGIS (camada espacial) e Redis (filas BullMQ).
# Bedrock/AWS são mockados nesta fase (ver apps/api/src/modules/ingest).
services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: geomatricula-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: geomatricula
      POSTGRES_PASSWORD: geomatricula
      POSTGRES_DB: geomatricula
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geomatricula -d geomatricula"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: geomatricula-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
